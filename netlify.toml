[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/legal/terms-and-conditions"
  to = "/conditions-generales/"
  status = 301

[[redirects]]
  from = "/terms-conditions"
  to = "/conditions-generales/"
  status = 301

# Anciennes adresses Webflow des projets
[[redirects]]
  from = "/work/*"
  to = "/realisations/"
  status = 301

[[redirects]]
  from = "/work"
  to = "/realisations/"
  status = 301

# Tout mène à https://dter.eu : ancien domaine, www et adresse Netlify
[[redirects]]
  from = "https://thomasdubois.pro/*"
  to = "https://dter.eu/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.thomasdubois.pro/*"
  to = "https://dter.eu/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://cosmic-dodol-d7bf9f.netlify.app/*"
  to = "https://dter.eu/:splat"
  status = 301
  force = true
