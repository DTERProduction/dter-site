  seoTitle: Event aftermovie and video coverage in Brussels · DTER
  eyebrow: Aftermovie · Event coverage · Brussels
  title: Your event lasts one evening. Its aftermovie works all year.
  lead: A film that brings your event back to life, sells the next edition and feeds your social channels for months. Conferences, launches and corporate evenings, in Brussels and across Belgium.
  bullets:
  - Aftermovie and vertical clips for your social channels
  - A teaser for your social channels within 5 working days, or within 48 hours as an option
  - Guaranteed delivery date, two rounds of revisions included
