  seoTitle: Event aftermovie and video coverage in Brussels · DTER
  eyebrow: Aftermovie · Event coverage · Brussels
  title: Your event lasts one evening. Its aftermovie works all year.
  lead: Video and photo coverage of conferences, launches and corporate evenings, in Brussels and across Belgium. One point of contact, a clear quote within 24 hours.
  bullets:
  - Aftermovie and vertical clips for your social channels
  - Delivery in one to three weeks, two rounds of revisions included
