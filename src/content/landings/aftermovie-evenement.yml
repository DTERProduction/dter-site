faqTitle: "Avant de demander un devis."
faq:
  - q: "Combien coûte un aftermovie ?"
    a: "À partir de 1 500 € HTVA pour une demi-journée de tournage et un aftermovie monté. Le devis détaille chaque poste, sans frais cachés."
  - q: "Quand recevrons-nous le film ?"
    a: "En une à trois semaines selon le projet. Le délai est fixé au devis, et deux tours de retours sont inclus."
  - q: "Notre événement est dans peu de temps, est-ce possible ?"
    a: "Souvent, oui. Indiquez la date dans le formulaire ou appelez directement : vous saurez tout de suite si la date est libre."
  - q: "Vous déplacez-vous hors de Bruxelles ?"
    a: "Oui, dans toute la Belgique et en Europe."
ctaTitle: "Votre date est-elle encore libre ?"
