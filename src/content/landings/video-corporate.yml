faqTitle: "Avant de demander un devis."
faq:
  - q: "Combien coûte une vidéo d'entreprise ?"
    a: "À partir de 2 500 € HTVA pour un jour de tournage et un film monté, avec ses déclinaisons. Le devis détaille chaque poste, sans frais cachés."
  - q: "Quand recevrons-nous le film ?"
    a: "En une à trois semaines selon le projet. Le délai est fixé au devis, et deux tours de retours sont inclus."
  - q: "Nos collaborateurs ne sont pas à l'aise face caméra, comment faire ?"
    a: "C'est le cas de presque tout le monde. Les entretiens sont préparés en amont et menés comme une conversation, en petite équipe."
  - q: "Vous déplacez-vous hors de Bruxelles ?"
    a: "Oui, dans toute la Belgique et en Europe."
