  faq:
  - q: How much does a corporate video cost?
    a: From €2,500 excl. VAT for one day of filming and one edited film, with its cutdowns. The quote details every item, with no hidden costs.
  - q: When will we receive the film?
    a: In one to three weeks depending on the project. The deadline is set in the quote, and two rounds of revisions are included.
  - q: Our people aren't comfortable on camera. What do you do?
    a: Almost nobody is. Interviews are prepared in advance and run like a conversation, with a small crew.
  - q: Do you travel outside Brussels?
    a: Yes, across Belgium and in Europe.
