en:
  seoTitle: Corporate video in Brussels · DTER
  eyebrow: Corporate video · Interviews · Brussels
  title: The corporate video that moves your goal forward.
  lead: Corporate films, client testimonials and interviews for marketing and communications teams, in Brussels and across Belgium. One point of contact, a clear quote within 24 hours.
  bullets:
  - A marketing eye from the brief, not just a nice picture
  - Delivery in one to three weeks, two rounds of revisions included
  - Cutdowns for your social channels, website and presentations
  formTitle: Get your quote within 24 hours
  dateLabel: Preferred deadline
  messageLabel: Your project in two lines
  clientsLabel: They trusted us with their image
  deliverTitle: Three formats, depending on what you want to achieve.
  deliverables:
  - title: The brand film
    text: Who you are and why people choose you, in one to two minutes. For your website, sales presentations and recruitment.
  - title: Testimonials and interviews
    text: Your clients, experts or colleagues on camera. Interviews prepared and run like a conversation.
  - title: Content for your social channels
    text: Short formats from the same shoot, subtitled, ready for LinkedIn. One day of filming, several weeks of posts.
