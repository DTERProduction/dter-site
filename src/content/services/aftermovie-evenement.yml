  - "Le tournage, avec une équipe dimensionnée selon la taille de l'événement"
  - "Montage, étalonnage, mixage, musique sous licence"
  - "Deux retours inclus, directement sur la vidéo"
  - "Les déclinaisons par format : 16:9, vertical, carré"
  - "En option : reportage photo par la même équipe"
