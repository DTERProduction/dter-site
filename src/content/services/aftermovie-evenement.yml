name: "Aftermovie et événement"
order: 20
title: "Aftermovie et captation vidéo d'événement à Bruxelles"
seoDescription: "Aftermovie, captation de conférence et extraits pour les réseaux, à Bruxelles et en Belgique. Livraison en une à trois semaines. À partir de 1 500 € HTVA."
lead: "Votre événement dure un soir. Son film travaille toute l'année. Conférences, lancements, salons et soirées d'entreprise, filmés et montés pour être diffusés dès les jours qui suivent."
short: "Conférences, lancements, soirées. Un aftermovie et des extraits prêts pour vos réseaux pendant que l'événement vit encore."
tags:
  - "Aftermovie"
  - "Captation"
  - "Extraits réseaux"
  - "Interviews sur place"
vimeoId: "1181916220"
usesTitle: "Quatre façons de filmer un événement."
uses:
  - title: "Aftermovie"
    text: "Le film qui résume l'ambiance, les moments forts et les visages. Pour remercier vos invités et vendre la prochaine édition."
  - title: "Captation de conférence"
    text: "Vos interventions filmées en entier, avec un son propre. Pour ceux qui n'étaient pas là et pour votre contenu de l'année."
  - title: "Extraits pour les réseaux"
    text: "Des formats courts, verticaux et sous-titrés, tirés du même tournage. Prêts pour LinkedIn et Instagram."
  - title: "Interviews sur place"
    text: "Vos intervenants, clients et partenaires interrogés pendant l'événement, quand l'énergie est là."
included:
  - "Un appel de préparation : programme, moments à ne pas manquer, personnes à filmer"
  - "Le tournage, avec une équipe dimensionnée selon la taille de l'événement"
  - "Montage, étalonnage, mixage, musique sous licence"
  - "Deux retours inclus, directement sur la vidéo"
  - "Les déclinaisons par format : 16:9, vertical, carré"
  - "En option : reportage photo par la même équipe"
categories:
  - "evenement"
projectsTitle: "Aftermovies réalisés."
priceTitle: "Combien coûte un aftermovie ?"
priceFrom: "1 500 €"
priceNote: "Une demi-journée de tournage et un aftermovie monté."
faqTitle: "Questions sur la captation d'événement."
faq:
  - q: "Quand recevrons-nous le film ?"
    a: "En une à trois semaines selon le projet. Le délai est fixé au devis. Une livraison express d'extraits sous 24 ou 48 h est possible."
  - q: "Notre événement est dans peu de temps, est-ce possible ?"
    a: "Souvent, oui. Contactez-nous avec la date : vous saurez tout de suite si elle est libre."
  - q: "Combien de personnes viennent filmer ?"
    a: "Une personne pour un format court, une équipe renforcée pour un grand événement ou plusieurs salles. C'est défini ensemble au brief."
  - q: "Vous déplacez-vous hors de Bruxelles ?"
    a: "Oui, dans toute la Belgique et en Europe."
# Version anglaise
en:
  name: Aftermovie and events
  title: Event aftermovie and video coverage in Brussels
  seoDescription: Aftermovies, conference recordings and social clips, in Brussels and across Belgium. Delivery in one to three weeks. From €1,500 excl. VAT.
  lead: Your event lasts one evening. Its film works all year. Conferences, launches, trade shows and corporate evenings, filmed and edited to go out in the days that follow.
  short: Conferences, launches, evenings. An aftermovie and clips ready for your channels while the event is still fresh.
  tags:
  - Aftermovie
  - Event coverage
  - Social clips
  - On-site interviews
  usesTitle: Four ways to film an event.
  uses:
  - title: Aftermovie
    text: The film that sums up the atmosphere, the highlights and the faces. To thank your guests and sell the next edition.
  - title: Conference recording
    text: Your talks filmed in full, with clean sound. For those who weren't there and for your content all year.
  - title: Social clips
    text: Short, vertical, subtitled formats from the same shoot. Ready for LinkedIn and Instagram.
  - title: On-site interviews
    text: Your speakers, clients and partners interviewed during the event, while the energy is there.
  included:
  - 'A preparation call: programme, moments not to miss, people to film'
  - The shoot, with a crew sized for the event
  - Editing, colour grading, sound mix, licensed music
  - Two rounds of revisions, directly on the video
  - 'Versions for each format: 16:9, vertical, square'
  - 'Optional: photo coverage by the same crew'
  projectsTitle: Aftermovies we've made.
  priceTitle: How much does an aftermovie cost?
  priceNote: Half a day of filming and one edited aftermovie.
  faqTitle: Questions about event coverage.
  faq:
  - q: When will we receive the film?
    a: In one to three weeks depending on the project. The deadline is set in the quote. Express delivery of clips within 24 or 48 hours is possible.
  - q: Our event is coming up soon. Is it still possible?
    a: Often, yes. Send us the date and you'll know straight away whether it's free.
  - q: How many people come to film?
    a: One person for a short format, a larger crew for a big event or several rooms. We decide together at the brief.
  - q: Do you travel outside Brussels?
    a: Yes, across Belgium and in Europe.
