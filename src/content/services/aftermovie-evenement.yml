projectsTitle: "Aftermovies réalisés."
priceTitle: "Combien coûte un aftermovie ?"
priceFrom: "1 500 €"
priceNote: "Une demi-journée de tournage et un aftermovie monté."
faqTitle: "Questions sur la captation d'événement."
faq:
  - q: "Quand recevrons-nous le film ?"
    a: "En une à trois semaines selon le projet. Le délai est fixé au devis. Une livraison express d'extraits sous 24 ou 48 h est possible."
  - q: "Notre événement est dans peu de temps, est-ce possible ?"
    a: "Souvent, oui. Contactez-nous avec la date : vous saurez tout de suite si elle est libre."
  - q: "Combien de personnes viennent filmer ?"
    a: "Une personne pour un format court, une équipe renforcée pour un grand événement ou plusieurs salles. C'est défini ensemble au brief."
  - q: "Vous déplacez-vous hors de Bruxelles ?"
    a: "Oui, dans toute la Belgique et en Europe."
