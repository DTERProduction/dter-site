title: "Aftermovie et captation vidéo d'événement à Bruxelles"
seoDescription: "Aftermovie, captation de conférence et extraits pour les réseaux, à Bruxelles et en Belgique. Livraison en une à trois semaines. À partir de 1 500 € HTVA."
lead: "Votre événement dure un soir. Son film travaille toute l'année. Conférences, lancements, salons et soirées d'entreprise, filmés et montés pour être diffusés dès les jours qui suivent."
short: "Conférences, lancements, soirées. Un aftermovie et des extraits prêts pour vos réseaux pendant que l'événement vit encore."
tags:
