usesTitle: "Quatre façons de filmer un événement."
uses:
  - title: "Aftermovie"
    text: "Le film qui résume l'ambiance, les moments forts et les visages. Pour remercier vos invités et vendre la prochaine édition."
  - title: "Captation de conférence"
    text: "Vos interventions filmées en entier, avec un son propre. Pour ceux qui n'étaient pas là et pour votre contenu de l'année."
  - title: "Extraits pour les réseaux"
    text: "Des formats courts, verticaux et sous-titrés, tirés du même tournage. Prêts pour LinkedIn et Instagram."
  - title: "Interviews sur place"
    text: "Vos intervenants, clients et partenaires interrogés pendant l'événement, quand l'énergie est là."
included:
