faqTitle: "Questions sur le brand content."
faq:
  - q: "Combien de vidéos peut-on tirer d'un jour de tournage ?"
    a: "Au moins quatre contenus, à décliner ensuite pour les réseaux sociaux. Le nombre exact dépend de la durée et du type de format."
  - q: "Gérez-vous aussi la publication ?"
    a: "Non. Nous livrons les vidéos prêtes à publier, aux bons formats, et vos équipes gardent la main sur la mise en ligne."
  - q: "Peut-on travailler ensemble chaque mois ?"
    a: "Oui. Un rendez-vous de tournage régulier coûte moins cher par vidéo et garde une image cohérente."
  - q: "Faut-il prévoir des comédiens ?"
    a: "Pas forcément. Vos équipes et vos clients sont souvent les meilleurs visages de votre marque."
