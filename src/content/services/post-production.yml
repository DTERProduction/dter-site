name: "Post-production"
order: 50
title: "Post-production vidéo à Bruxelles : montage, étalonnage"
seoDescription: "Montage, étalonnage, mixage et motion design à Bruxelles, pour vos rushes ou les nôtres. Une à deux semaines pour un format court. À partir de 900 € HTVA."
lead: "C'est ici que le film se joue. Vous avez les images, nous en faisons un film. Montage, étalonnage, son et habillage, pour des rushes tournés par nous ou par d'autres."
short: "Montage, étalonnage, mixage, motion design, sous-titrage. Aussi pour des rushes tournés par d'autres."
tags:
  - "Montage"
  - "Étalonnage"
  - "Mixage"
  - "Motion design"
  - "Sound design"
usesTitle: "Quatre besoins de post-production."
uses:
  - title: "Montage de vos rushes"
    text: "Vous avez tourné en interne ou avec une autre équipe. Nous structurons le récit et livrons un film fini."
  - title: "Déclinaisons et sous-titrage"
    text: "Un film existant, adapté en formats courts, verticaux, sous-titrés ou traduits."
  - title: "Étalonnage et mixage"
    text: "L'image et le son mis au niveau d'une diffusion professionnelle."
  - title: "Motion design"
    text: "Titres, infographies animées, habillage à votre charte. Pour expliquer ce que l'image seule ne montre pas."
included:
  - "Un échange sur l'objectif du film et le public visé"
  - "Le dérushage et une proposition de structure"
  - "Montage, étalonnage, mixage, sound design"
  - "Motion design et sous-titres selon le besoin"
  - "Deux tours de retours, directement sur la vidéo"
  - "Les exports aux formats de chaque plateforme"
categories: []
priceTitle: "Combien coûte un montage vidéo ?"
priceFrom: "900 €"
priceNote: "Le montage d'un format court. Devis au forfait selon le projet."
faqTitle: "Questions sur la post-production."
faq:
  - q: "Travaillez-vous avec des images que vous n'avez pas tournées ?"
    a: "Oui. Envoyez vos rushes, nous vous disons ce qu'il est possible d'en faire."
  - q: "Comment vous transmettre les fichiers ?"
    a: "Comme vous préférez : directement sur nos serveurs, via un outil de transfert de fichiers, ou en main propre autour d'un café."
  - q: "Quels formats de fichiers acceptez-vous ?"
    a: "Tous, quelle que soit la caméra. S'il y a des images, il y a un film à faire."
  - q: "Quel délai pour un montage ?"
    a: "Une à deux semaines pour un format court."
# Version anglaise
en:
  name: Post-production
  title: 'Video post-production in Brussels: editing, grading'
  seoDescription: Editing, colour grading, sound mix and motion design in Brussels, for your footage or ours. One to two weeks for a short format. From €900 excl. VAT.
  lead: This is where the film is made. You have the footage, we turn it into a film. Editing, colour, sound and graphics, for footage shot by us or by others.
  short: Editing, colour grading, sound mix, motion design, subtitling. Also for footage shot by others.
  tags:
  - Editing
  - Colour grading
  - Sound mix
  - Motion design
  - Sound design
  usesTitle: Four post-production needs.
  uses:
  - title: Editing your footage
    text: You filmed in-house or with another crew. We shape the story and deliver a finished film.
  - title: Cutdowns and subtitling
    text: An existing film, adapted into short, vertical, subtitled or translated formats.
  - title: Colour grading and sound mix
    text: Picture and sound brought up to professional broadcast level.
  - title: Motion design
    text: Titles, animated infographics, graphics in your brand style. To explain what footage alone can't show.
  included:
  - A conversation about the film's goal and audience
  - Logging the footage and a proposed structure
  - Editing, colour grading, sound mix, sound design
  - Motion design and subtitles as needed
  - Two rounds of revisions, directly on the video
  - Exports in each platform's format
  priceTitle: How much does video editing cost?
  priceNote: Editing one short format. Fixed-price quote per project.
  faqTitle: Questions about post-production.
  faq:
  - q: Do you work with footage you didn't shoot?
    a: Yes. Send us your footage and we'll tell you what can be done with it.
  - q: How do we send you the files?
    a: 'However you prefer: straight to our servers, through a file transfer tool, or in person over a coffee.'
  - q: Which file formats do you accept?
    a: All of them, whatever the camera. If there's footage, there's a film to make.
  - q: How long does an edit take?
    a: One to two weeks for a short format.
