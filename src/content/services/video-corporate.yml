usesTitle: "Quatre usages de la vidéo d'entreprise."
uses:
  - title: "Film de marque"
    text: "Qui vous êtes et pourquoi on vous choisit. Pour votre site, vos présentations commerciales et vos salons."
  - title: "Témoignage client"
    text: "Vos clients racontent ce que vous avez changé pour eux. La preuve la plus crédible dans un cycle de vente."
  - title: "Marque employeur"
    text: "Vos équipes, vos métiers, votre quotidien. Pour recruter des profils qui vous ressemblent."
  - title: "Interview d'expert"
    text: "Vos dirigeants et spécialistes face caméra, sur les sujets où vous faites autorité."
included:
  - "Un appel de cadrage sur votre objectif et votre public"
  - "L'écriture : angle, déroulé, questions d'interview"
